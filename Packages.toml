# packages that are slow, and should be granted more test time (they're worth it)
[slow]
PackageCompiler = "2x"
ChainRules = "2x"
StaticArrays = "3x"
Distributions = "2x"
HTTP = "2x"
Pkg = "5x"
LinearAlgebra = "5x"
